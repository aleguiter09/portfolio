logoAlt: margo-logo
description:
  en: >-
    Margo it's a comprehensive finance tracking application that allows users to
    record income, categorize expenses, and monitor account balances.
    Implemented secure authentication and real-time database management using
    Supabase to deliver a seamless money management experience.
  es: >-
    Margo es una aplicación de seguimiento financiero que permite a los usuarios
    registrar y categorizar sus transacciones asi como monitorear los saldos de
    sus cuentas para facilitar la gestión y planificación de su dinero.
stack:
  - next
  - tailwind
